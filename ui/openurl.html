<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Abrir endereço</title>
    <link rel="stylesheet" href="./src/openurl.css" />
  </head>
  <body>
    <form id="form">
      <label for="url">Endereço (stream de rádio ou playlist .pls/.m3u):</label>
      <input id="url" type="url" placeholder="http://" autocomplete="off" spellcheck="false" required />
      <p id="error" role="alert"></p>
      <div class="buttons">
        <button type="button" id="enqueue">Adicionar à playlist</button>
        <button type="submit" id="play">Tocar</button>
        <button type="button" id="cancel">Cancelar</button>
      </div>
    </form>
    <script type="module" src="./src/openurl.ts"></script>
  </body>
</html>
