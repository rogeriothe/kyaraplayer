[package]
name = "kyara-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
audio-engine = { version = "0.1.0", path = "../crates/audio-engine" }
crossbeam-channel = "0.5.17"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.34"
playlist = { version = "0.1.0", path = "../crates/playlist" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skin = { version = "0.1.0", path = "../crates/skin" }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
